<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Downly | TikTok, Instagram, Pinterest, YouTube & Facebook Downloader</title>

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ff2855">
<link rel="apple-touch-icon" href="/icon-192.png">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #050505;
  color: white;
}

.container {
  width: min(700px, 94%);
  margin: auto;
  padding: 40px 0;
}

h1 {
  font-size: clamp(32px, 7vw, 50px);
  text-align: center;
  margin: 0 0 20px;
}

.pink { color: #ff2855; }

.install-bar {
  display: none;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 14px 18px;
  background: #0c0c0c;
  border: 1px solid #ff2855;
  border-radius: 16px;
  margin-bottom: 20px;
}

.install-bar span {
  font-size: 14px;
  color: #ddd;
}

.install-btn {
  padding: 10px 18px;
  border: 0;
  border-radius: 10px;
  background: #ff2855;
  color: white;
  font-weight: bold;
  cursor: pointer;
  white-space: nowrap;
}

.tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 20px;
}

.tab {
  padding: 14px 8px;
  border-radius: 14px;
  background: #111;
  border: 1px solid #292929;
  text-align: center;
  cursor: pointer;
  font-weight: bold;
  color: #999;
  font-size: 14px;
}

.tab.active {
  background: #ff2855;
  color: white;
  border-color: #ff2855;
}

.box {
  padding: 18px;
  border: 1px solid #292929;
  border-radius: 25px;
  background: #0c0c0c;
}

input {
  width: 100%;
  padding: 18px;
  border-radius: 15px;
  border: 1px solid #333;
  background: #151515;
  color: white;
  font-size: 16px;
  outline: none;
}

input:focus { border-color: #ff2855; }

.search {
  width: 100%;
  margin-top: 12px;
  padding: 18px;
  border: 0;
  border-radius: 15px;
  background: #ff2855;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.search:disabled { opacity: 0.6; cursor: not-allowed; }

.result { display: none; margin-top: 25px; }

.message {
  padding: 16px;
  border-radius: 15px;
  background: #281017;
  color: #ff9aae;
  text-align: center;
  margin-bottom: 20px;
}

.message.success { background: #0f2818; color: #9affb8; }

.preview {
  padding: 18px;
  background: #0d0d0d;
  border: 1px solid #292929;
  border-radius: 20px;
  text-align: center;
}

.preview img, .preview video {
  width: 100%;
  border-radius: 14px;
  max-height: 480px;
  object-fit: contain;
  background: #000;
}

.preview h3 {
  margin-top: 0;
  font-size: 16px;
  color: #ddd;
}

.buttons {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 15px;
}

.dl {
  padding: 16px;
  border: 0;
  border-radius: 14px;
  background: white;
  color: black;
  font-weight: bold;
  cursor: pointer;
  text-decoration: none;
  display: block;
}

.dl.secondary {
  background: #181818;
  border: 1px solid #333;
  color: white;
}
</style>
</head>

<body>

<div class="container">

  <h1>Down<span class="pink">ly</span></h1>

  <div id="installBar" class="install-bar">
    <span>Install Downly as an app for faster access</span>
    <button id="installBtn" class="install-btn">Install App</button>
  </div>

  <div class="tabs">
    <div class="tab active" data-platform="tiktok">TikTok</div>
    <div class="tab" data-platform="instagram">Instagram</div>
    <div class="tab" data-platform="pinterest">Pinterest</div>
    <div class="tab" data-platform="youtube">YouTube</div>
    <div class="tab" data-platform="facebook">Facebook</div>
  </div>

  <div class="box">
    <input id="url" type="text" placeholder="Paste TikTok video link here">
    <button id="searchBtn" class="search" onclick="search()">Search</button>
  </div>

  <div id="result" class="result">
    <div id="message" class="message"></div>
    <div id="preview" class="preview" style="display:none;"></div>
  </div>

</div>

<script>

// ---------- PWA Install Prompt ----------

let deferredPrompt = null

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault()
  deferredPrompt = e
  document.getElementById("installBar").style.display = "flex"
})

document.getElementById("installBtn").addEventListener("click", async () => {
  if (!deferredPrompt) return
  deferredPrompt.prompt()
  await deferredPrompt.userChoice
  deferredPrompt = null
  document.getElementById("installBar").style.display = "none"
})

window.addEventListener("appinstalled", () => {
  document.getElementById("installBar").style.display = "none"
})

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").catch(() => {})
  })
}

// ---------- Downloader Logic ----------

let currentPlatform = "tiktok"

const placeholders = {
  tiktok: "Paste TikTok video link here",
  instagram: "Paste Instagram post or reel link here",
  pinterest: "Paste Pinterest pin link here",
  youtube: "Paste YouTube video link here",
  facebook: "Paste Facebook video link here"
}

const qualityLabels = {
  hd_no_watermark: "Download HD (No Watermark)",
  no_watermark: "Download (No Watermark)",
  watermark: "Download (With Watermark)",
  audio: "Download Audio Only (MP3)"
}

document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"))
    tab.classList.add("active")
    currentPlatform = tab.dataset.platform
    document.getElementById("url").placeholder = placeholders[currentPlatform]
    document.getElementById("result").style.display = "none"
    document.getElementById("url").value = ""
  })
})

async function search() {

  const input = document.getElementById("url")
  const url = input.value.trim()
  const btn = document.getElementById("searchBtn")

  if (!url) {
    alert("Please paste a link first.")
    return
  }

  const result = document.getElementById("result")
  const message = document.getElementById("message")
  const preview = document.getElementById("preview")

  result.style.display = "block"
  preview.style.display = "none"
  message.classList.remove("success")
  message.textContent = "Searching..."

  btn.disabled = true
  btn.textContent = "Searching..."

  try {

    const response = await fetch("/api/fetch", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url })
    })

    const data = await response.json()

    if (!data.success) {
      message.textContent = data.error || "Could not find this content."
      return
    }

    message.classList.add("success")
    message.textContent = "Found! See preview below."

    renderPreview(data)

  } catch (error) {
    message.textContent = "Server connection failed. Please try again."
  } finally {
    btn.disabled = false
    btn.textContent = "Search"
  }
}

function proxyDownloadUrl(mediaUrl, quality, extension) {
  const filename = `downly-${quality}.${extension}`
  return `/api/download-proxy?url=${encodeURIComponent(mediaUrl)}&filename=${encodeURIComponent(filename)}`
}

function renderPreview(data) {

  const preview = document.getElementById("preview")
  preview.style.display = "block"
  preview.innerHTML = ""

  const titleEl = document.createElement("h3")
  titleEl.textContent = data.title || "Preview"
  preview.appendChild(titleEl)

  const videos = data.medias.filter(m => m.type === "video")
  const images = data.medias.filter(m => m.type === "image")
  const audios = data.medias.filter(m => m.type === "audio")

  const bestVideo =
    videos.find(v => v.quality === "hd_no_watermark") ||
    videos.find(v => v.quality === "no_watermark") ||
    videos[0]

  if (bestVideo) {
    const video = document.createElement("video")
    video.src = bestVideo.url
    video.controls = true
    if (data.thumbnail) video.poster = data.thumbnail
    preview.appendChild(video)
  } else if (images.length > 0) {
    const img = document.createElement("img")
    img.src = images[0].url
    preview.appendChild(img)
  } else if (data.thumbnail) {
    const img = document.createElement("img")
    img.src = data.thumbnail
    preview.appendChild(img)
  }

  const buttons = document.createElement("div")
  buttons.className = "buttons"

  videos.forEach((v, i) => {
    const a = document.createElement("a")
    a.href = proxyDownloadUrl(v.url, v.quality, v.extension)
    a.className = i === 0 ? "dl" : "dl secondary"
    a.textContent = qualityLabels[v.quality] || `Download Video (${v.quality})`
    buttons.appendChild(a)
  })

  images.forEach((img, i) => {
    const a = document.createElement("a")
    a.href = proxyDownloadUrl(img.url, `image-${i + 1}`, img.extension)
    a.className = "dl secondary"
    a.textContent = images.length > 1 ? `Download Image ${i + 1}` : "Download Image"
    buttons.appendChild(a)
  })

  audios.forEach(aud => {
    const a = document.createElement("a")
    a.href = proxyDownloadUrl(aud.url, "audio", aud.extension)
    a.className = "dl secondary"
    a.textContent = qualityLabels.audio
    buttons.appendChild(a)
  })

  preview.appendChild(buttons)
}

document.getElementById("url").addEventListener("keydown", (e) => {
  if (e.key === "Enter") search()
})

</script>

</body>
</html>
