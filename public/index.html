<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Downly | Multi Social Video Tool</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #050505;
  color: white;
}

.container {
  width: min(900px, 94%);
  margin: auto;
  padding: 50px 0;
}

.badge {
  display: inline-block;
  padding: 12px 24px;
  border: 1px solid #333;
  border-radius: 30px;
  color: #ddd;
  margin-bottom: 25px;
}

h1 {
  font-size: clamp(42px, 8vw, 80px);
  line-height: 0.95;
  margin: 0 0 25px;
}

.pink {
  color: #ff2855;
}

.subtitle {
  color: #aaa;
  font-size: 20px;
  line-height: 1.6;
}

.box {
  margin-top: 35px;
  padding: 18px;
  border: 1px solid #292929;
  border-radius: 25px;
  background: #0c0c0c;
}

input {
  width: 100%;
  padding: 18px;
  border-radius: 15px;
  border: 1px solid #333;
  background: #151515;
  color: white;
  font-size: 16px;
  outline: none;
}

.analyze {
  width: 100%;
  margin-top: 12px;
  padding: 18px;
  border: 0;
  border-radius: 15px;
  background: #ff2855;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.platforms {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-top: 15px;
}

.platform {
  padding: 17px;
  border-radius: 15px;
  background: #111;
  border: 1px solid #292929;
  text-align: center;
}

.result {
  display: none;
  margin-top: 30px;
}

.message {
  padding: 18px;
  border-radius: 15px;
  background: #281017;
  color: #ff9aae;
  text-align: center;
}

.preview {
  margin-top: 25px;
  padding: 20px;
  background: #0d0d0d;
  border: 1px solid #292929;
  border-radius: 20px;
}

.preview h2 {
  margin-top: 0;
}

.player {
  width: 100%;
  min-height: 500px;
  border: 0;
  border-radius: 15px;
  background: #000;
}

.actions {
  display: flex;
  gap: 12px;
  margin-top: 15px;
}

.download {
  flex: 1;
  padding: 16px;
  border: 0;
  border-radius: 14px;
  background: white;
  color: black;
  font-weight: bold;
  cursor: pointer;
}

.open {
  flex: 1;
  padding: 16px;
  border-radius: 14px;
  background: #181818;
  border: 1px solid #333;
  color: white;
  text-align: center;
  text-decoration: none;
}

@media(max-width: 600px) {
  .container {
    padding: 35px 0;
  }

  .platforms {
    grid-template-columns: 1fr 1fr;
  }

  .player {
    min-height: 420px;
  }

  .actions {
    flex-direction: column;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="badge">
    Multi Social Video Tool
  </div>

  <h1>
    Download your<br>
    <span class="pink">videos</span> easily.
  </h1>

  <p class="subtitle">
    Paste your video URL below and preview supported social media content.
  </p>

  <div class="box">

    <input
      id="url"
      type="text"
      placeholder="Paste TikTok, YouTube, Instagram, Facebook or Pinterest URL"
    >

    <button class="analyze" onclick="analyzeVideo()">
      Analyze
    </button>

    <div class="platforms">
      <div class="platform">YouTube</div>
      <div class="platform">TikTok</div>
      <div class="platform">Instagram</div>
      <div class="platform">Pinterest</div>
      <div class="platform">Facebook</div>
    </div>

  </div>

  <div id="result" class="result">

    <div id="message" class="message"></div>

    <div id="previewBox" class="preview">
      <h2 id="previewTitle">Video Preview</h2>

      <div id="player"></div>

      <div class="actions">

        <button
          id="downloadButton"
          class="download"
          onclick="downloadVideo()"
        >
          Download Video
        </button>

        <a
          id="openButton"
          class="open"
          href="#"
          target="_blank"
        >
          Open Original
        </a>

      </div>
    </div>

  </div>

</div>

<script>

let currentUrl = ""

async function analyzeVideo() {

  const input = document.getElementById("url")
  const url = input.value.trim()

  if (!url) {
    alert("Please paste a video URL first.")
    return
  }

  currentUrl = url

  const result = document.getElementById("result")
  const message = document.getElementById("message")
  const player = document.getElementById("player")
  const openButton = document.getElementById("openButton")

  result.style.display = "block"

  message.textContent = "Analyzing video..."
  player.innerHTML = ""

  openButton.href = url

  try {

    const response = await fetch(
      `/api/analyze?url=${encodeURIComponent(url)}`
    )

    const data = await response.json()

    if (!data.success) {
      message.textContent = data.error || "Unable to analyze this URL."
      return
    }

    message.textContent =
      `${data.platform} detected. Preview is being loaded.`

    loadPreview(data)

  } catch (error) {

    message.textContent =
      "Server connection failed. Please try again."

  }
}

function loadPreview(data) {

  const player = document.getElementById("player")
  const title = document.getElementById("previewTitle")

  player.innerHTML = ""

  if (!data.preview) {

    player.innerHTML = `
      <div style="
        min-height:300px;
        display:flex;
        align-items:center;
        justify-content:center;
        color:#888;
        text-align:center;
        padding:30px;
      ">
        Preview is not available for this URL.
      </div>
    `

    return
  }

  if (data.preview.type === "youtube") {

    title.textContent = "YouTube Preview"

    player.innerHTML = `
      <iframe
        class="player"
        src="${data.preview.embedUrl}"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
    `

    return
  }

  if (data.preview.type === "tiktok") {

    title.textContent = "TikTok Preview"

    player.innerHTML = `
      <iframe
        class="player"
        src="${data.preview.embedUrl}"
        allow="autoplay; encrypted-media;"
        allowfullscreen>
      </iframe>
    `

    return
  }

  if (data.preview.type === "instagram") {

    title.textContent = "Instagram Preview"

    player.innerHTML = `
      <blockquote
        class="instagram-media"
        data-instgrm-permalink="${data.originalUrl}"
        data-instgrm-version="14"
        style="width:100%; margin:0;">
      </blockquote>
    `

    loadInstagram()

    return
  }

  if (data.preview.type === "facebook") {

    title.textContent = "Facebook Preview"

    const encoded = encodeURIComponent(data.originalUrl)

    player.innerHTML = `
      <iframe
        class="player"
        src="https://www.facebook.com/plugins/video.php?href=${encoded}&show_text=false"
        scrolling="no"
        frameborder="0"
        allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
    `

    return
  }

  if (data.preview.type === "pinterest") {

    title.textContent = "Pinterest Preview"

    player.innerHTML = `
      <div
        class="pin"
        data-pin-do="embedPin"
        data-pin-width="large"
        data-pin-terse="true">
        <a href="${data.originalUrl}">Pinterest Video</a>
      </div>
    `

    loadPinterest()

    return
  }
}

function loadInstagram() {

  if (window.instgrm) {
    window.instgrm.Embeds.process()
    return
  }

  const script = document.createElement("script")

  script.src = "https://www.instagram.com/embed.js"
  script.async = true

  script.onload = () => {
    if (window.instgrm) {
      window.instgrm.Embeds.process()
    }
  }

  document.body.appendChild(script)
}

function loadPinterest() {

  if (window.PinUtils) {
    window.PinUtils.build()
    return
  }

  const script = document.createElement("script")

  script.src = "https://assets.pinterest.com/js/pinit.js"
  script.async = true

  document.body.appendChild(script)
}

function downloadVideo() {

  if (!currentUrl) {
    alert("Analyze a video first.")
    return
  }

  alert(
    "Preview system is connected. Direct social-media downloading requires an authorized media source."
  )
}

</script>

</body>
</html>
